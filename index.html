  --dot:rgba(0,0,0,.2);--panel:rgba(255,255,255,.94);--b:rgba(0,0,0,.09);--h:rgba(0,0,0,.06);--sel:#2f8cf5;--solid:#fff;--ink:#1c1c1e;--capon:#d6e8fe;}
:root.dark body{background:#1b1b1d;color:#ececec;--dot:rgba(255,255,255,.16);--panel:rgba(44,44,46,.95);--b:rgba(255,255,255,.12);--h:rgba(255,255,255,.09);--solid:#2c2c2e;--ink:#ececec;--capon:#1d3d63;}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
svg{display:block;}
#app{position:absolute;inset:0;display:flex;flex-direction:column;}

/* barra superior */
.top{display:flex;flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 54px 8px 10px;align-items:center;flex-shrink:0;z-index:2;}
.bar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.12),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-width:0;}
.bt{height:36px;min-width:36px;padding:0 10px !important;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt:hover{background:var(--h);}
.bt:disabled{opacity:.3;cursor:default;}
.bt svg{width:20px;height:20px;}
.crumb{padding:0 8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;}
.crumb i{font-style:normal;opacity:.4;margin:0 5px;}
.crumb a{cursor:pointer;}
.search{display:flex;align-items:center;gap:4px;flex:1 1 150px;min-width:130px;}
.search input{flex:1;min-width:0;height:36px;padding:0 8px !important;font-size:16px;outline:none;cursor:text !important;-webkit-user-select:text;user-select:text;}

.tabs{display:flex;gap:6px;padding:0 10px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 13px !important;flex-shrink:0;border-radius:16px;background:var(--h) !important;font-weight:600;white-space:nowrap;}
.tab.on{background:var(--sel) !important;color:#fff !important;}
/* cuerpo */
.body{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;}
.in{animation:in .22s ease-out;}
@keyframes in{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.page{width:100%;padding:6px 12px 110px;}
.lh{font-size:22px;font-weight:800;padding:6px 4px 10px;}
.lh small{font-size:13px;font-weight:500;opacity:.55;margin-left:10px;}
.list{background:var(--panel);border-radius:14px;box-shadow:0 0 0 .5px var(--b);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px !important;text-align:left;border-bottom:.5px solid var(--b) !important;}
.row:last-child{border-bottom:0 !important;}
.row:hover{background:var(--h);}
.row .rn{flex:1;font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .rs{opacity:.5;font-size:13px;white-space:nowrap;}
.sq{width:28px;height:28px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.fh{border-radius:16px;padding:16px 18px;font-size:28px;font-weight:800;margin:6px 0 4px;}
.fd{opacity:.6;padding:0 4px 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px;}
.chip{padding:6px 12px !important;border-radius:14px;background:var(--h) !important;font-size:14px;}
.chip.on{background:var(--sel) !important;color:#fff !important;}
.chip.go{background:var(--sel) !important;color:#fff !important;font-weight:700;}
.chips .sep{width:1px;background:var(--b);margin:0 4px;}
.sf{margin:14px 0 6px;font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
.sf small{opacity:.5;font-weight:500;font-size:13px;}
.sf a{cursor:pointer;border-radius:8px;padding:2px 10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.card{position:relative;border-radius:10px;padding:10px 12px 12px;padding-right:46px;min-height:84px;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06);cursor:pointer;}

.card .an{display:block;font-size:13px;opacity:.75;margin-top:3px;line-height:1.3;}
.card .sb{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin-top:6px;}
.card .sb2{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;margin-top:4px;line-height:1.3;}
.card .sb2 span{opacity:.85;padding-top:1px;}
.card .sb2 i{display:inline-flex;gap:3px;flex-shrink:0;font-style:normal;}
.card .sb2 i b{display:inline-block;min-width:30px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.03em;line-height:1;padding:3px 5px;border-radius:5px;color:#fff;}
.card .sb2 .iz{background:#6a4fb3;}
.card .sb2 .de{background:#0070d1;}
.card .sb2 .am{background:#8e8e93;}
.card .acts{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;}
.card .acts button{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.55);color:#1c1c1e;}
.card .acts button:hover{background:rgba(255,255,255,.9);}
.card .acts button.on{background:#34c759;color:#fff;}
.card .acts button.pl{background:#2f8cf5;color:#fff;font-size:12px;}
/* rutinas */
.blk{border-radius:16px;padding:10px;margin:10px 0 14px;}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dot{width:26px;height:26px;border-radius:50% !important;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.bn{flex:1;min-width:0;font-size:17px !important;font-weight:700;outline:none;padding:4px 2px !important;cursor:text !important;-webkit-user-select:text;user-select:text;}
.bc{opacity:.55;font-size:13px;white-space:nowrap;}
.bnote{display:block;width:100%;margin-top:10px;min-height:56px;border-radius:10px;border:1px solid var(--b);background:var(--panel);color:inherit;padding:8px 10px;font:inherit;font-size:14px;resize:vertical;outline:none;-webkit-user-select:text;user-select:text;}
.chip:disabled{opacity:.35;cursor:default;}
.rcount{opacity:.55;font-size:14px;align-self:center;padding-left:4px;}
.blk input,.blk textarea{cursor:text !important;-webkit-user-select:text;user-select:text;}
.rh1{display:flex;align-items:center;gap:6px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--b);}
.rt1{flex:1;min-width:0;font-size:19px !important;font-weight:800;outline:none;padding:2px !important;}
.rh2{margin:10px 0 6px;padding:8px 10px;border-radius:12px;background:var(--panel);box-shadow:0 0 0 .5px var(--b);}
.rh2a{display:flex;align-items:center;gap:6px;}
.rt2{flex:1;min-width:0;font-size:16px !important;font-weight:700;outline:none;padding:2px !important;}
.rd2{display:block;width:100%;font:inherit;font-size:14px;line-height:1.35;opacity:.75;resize:none;overflow:hidden;background:transparent;border:0;outline:none;color:inherit;padding:2px;}
.hacts{display:flex;gap:4px;flex-shrink:0;}

.days{display:flex;gap:4px;padding:12px 14px 6px;}

.padbox{background:var(--panel);border-radius:16px;box-shadow:0 0 0 .5px var(--b);padding:10px 10px 12px;margin-bottom:12px;}

.hd{display:block;width:100%;height:auto;}
.hd .o{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linejoin:round;}

.hd .k.nx,.hd .k.sel{fill:rgba(47,140,245,.28);}

.hd .hl{fill:currentColor;opacity:.45;font-size:12px;text-anchor:middle;}

.padinfo{display:flex;flex-direction:column;gap:2px;padding:8px 6px 0;min-height:52px;}

.padinfo span{font-size:14px;opacity:.75;}
/* reproductor y sesión */
#play,#ses{position:fixed;inset:0;z-index:910;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
#play.open,#ses.open{display:flex;}
#play .pk,#ses .pk{background:var(--solid);width:100%;max-width:560px;max-height:92vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}

.plcap{text-align:center;font-size:17px;font-weight:600;min-height:30px;padding:8px 16px 0;}
.plkeys{text-align:center;font-size:13px;opacity:.6;min-height:18px;padding:2px 16px 0;}
.plhint{text-align:center;font-size:12px;opacity:.45;padding:6px 16px 0;}
.pldots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:6px 12px 4px;}
.pldots i{width:9px;height:9px;border-radius:50%;background:var(--b);cursor:pointer;}
.pldots i.on{background:#2f8cf5;}
.pldots i.ok{background:#34c759;}
.plctl{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px 4px;flex-wrap:wrap;}
.plctl [data-pl],.plctl [data-s]{width:44px;height:40px;border-radius:12px;background:var(--h);font-size:18px;font-weight:700;}
.plctl .sep{width:1px;height:24px;background:var(--b);margin:0 6px;}
.ssec{text-align:center;font-size:12px;font-weight:700;opacity:.5;padding:2px 16px 0;text-transform:uppercase;letter-spacing:.05em;}
.sname{text-align:center;font-size:22px;font-weight:800;padding:2px 16px 0;}
.sdesc{text-align:center;font-size:14px;opacity:.65;padding:2px 20px 4px;}
.stimer{text-align:center;font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.05;padding:4px 0 0;}
.stimer.prep{color:#2f8cf5;font-weight:600;}
.bpmv{min-width:78px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;}
.bpmv small{font-weight:500;opacity:.55;font-size:12px;}
.srate{display:none;flex-direction:column;align-items:center;gap:6px;padding:8px 12px 4px;}
.srate.on{display:flex;}
.srate p{font-size:14px;opacity:.6;}
.srate .chips{justify-content:center;padding:0;}
.srate .chip{padding:10px 14px !important;font-weight:600;}
.sdone{padding:18px 16px 8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.sdone .big{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;}
/* elegir ejercicios */
#pick{position:fixed;inset:0;z-index:900;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
#pick.open{display:flex;}
#pick .pk{background:var(--solid);width:100%;max-width:520px;max-height:86vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3);}
@media (min-width:600px){#pick{align-items:center;}#pick .pk{border-radius:18px;}}
.pkh{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;font-weight:700;}
.pkh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pkh button{padding:8px 16px !important;border-radius:10px;background:var(--sel) !important;color:#fff !important;font-weight:600;}
.pks{padding:0 14px 6px;}
.pks input{width:100%;height:38px;border-radius:10px;border:1px solid var(--b) !important;padding:0 10px !important;font-size:16px;outline:none;cursor:text !important;-webkit-user-select:text;user-select:text;}
.pkl{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 8px calc(14px + env(safe-area-inset-bottom,0px));}
.pkt{font-size:13px;font-weight:700;opacity:.55;margin:12px 8px 4px;}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 8px !important;border-radius:10px;}
.prow:hover{background:var(--h);}
.prow .pd{width:14px;height:14px;border-radius:4px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.prow .pn{flex:1;min-width:0;}
.prow .pn small{display:block;opacity:.55;font-size:12px;}
.prow .pi{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--h);font-weight:700;flex-shrink:0;}
.prow.in .pi{background:#34c759;color:#fff;}
.card.done{box-shadow:0 0 0 2px #34c759;}
.empty{opacity:.55;padding:40px 10px;text-align:center;}
@media (max-width:560px){.grid{grid-template-columns:1fr;}.fh{font-size:22px;}.row .rs{max-width:38vw;overflow:hidden;text-overflow:ellipsis;}}

/* menú ⋯ */
.menu{position:fixed;z-index:8;display:none;min-width:236px;background:var(--panel);border-radius:18px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.22),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);}
.menu.open{display:block;}
.menu button{display:block;width:100%;text-align:left;padding:12px 14px !important;border-radius:12px;font-size:15px;}
.menu button:hover,.menu button:active{background:var(--h);}

/* nota amarilla */
.notebtn{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;width:52px;height:52px;border-radius:50% !important;background:#ffd400 !important;color:#1c1c1e !important;box-shadow:0 4px 16px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;}
.lad{position:fixed;z-index:7;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 24px));max-height:min(70vh,640px);display:none;flex-direction:column;background:var(--panel);border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.3),0 0 0 .5px var(--b);overflow:hidden;-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);}
.lad.open{display:flex;}

.lad .lhd span{flex:1;}
.lad .lhd button{background:rgba(0,0,0,.12) !important;width:28px;height:28px;border-radius:50%;font-size:18px;line-height:1;color:#1c1c1e;}
.lad .lb{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 14px;}
.lad .lt{font-weight:700;font-size:13px;margin:14px 0 4px;opacity:.65;}
.lad .li{display:flex;gap:10px;padding:5px 0;font-size:15px;line-height:1.3;}
.lad .li small{opacity:.6;font-size:13px;}
.lad .li .lk{width:18px;flex-shrink:0;opacity:.55;font-weight:700;}

/* aviso */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1c1c1e;color:#fff;border-radius:14px;padding:9px 16px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.35);transition:.18s;z-index:999;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
:root.dark .toast{background:#ececec;color:#1c1c1e;}
.toast.show{opacity:1;transform:translate(-50%,0);}

/* nube de GitHub */
#ml-cloud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:60;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:#8e8e93;}
#ml-cloud svg{width:23px;height:23px;}
#ml-cloud .slash{display:none;}
#ml-cloud.s-none{opacity:.75;}
#ml-cloud.s-none .slash{display:inline;}

@keyframes pulse{50%{opacity:.35;}}
@media (prefers-reduced-motion:reduce){#ml-cloud.s-sync{animation:none;}.in{animation:none;}}
#ml-gh{position:fixed;inset:0;z-index:950;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.35);}
#ml-gh.open{display:flex;}
#ml-gh .g{background:var(--panel);color:inherit;border-radius:18px;width:100%;max-width:440px;max-height:92vh;overflow:auto;padding:18px;font-size:14px;line-height:1.45;box-shadow:0 8px 30px rgba(0,0,0,.35);-webkit-user-select:text;user-select:text;}
:root.dark #ml-gh .g{background:#2c2c2e;}
#ml-gh h3{font-size:17px;margin:0 0 6px;}
#ml-gh .st{margin:6px 0 10px;opacity:.6;}
#ml-gh .er{color:#d32f2f;margin:8px 0;}

#ml-gh input{width:100%;font-size:16px;padding:9px 10px !important;border:1px solid var(--b) !important;border-radius:10px;background:transparent;outline:none;cursor:text;}
#ml-gh .rw{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
#ml-gh .rw button{font-size:14px;padding:9px 14px !important;border-radius:10px;background:var(--h);font-weight:600;}
#ml-gh .rw button.pri{background:var(--sel);color:#fff;}

#ml-gh .rw button:disabled{opacity:.5;}
#ml-gh details{margin-top:12px;opacity:.75;}
#ml-gh summary{cursor:pointer;}
#ml-gh ol{margin:8px 0 0 18px;}
#ml-gh li{margin:3px 0;}
</style>

<script>
// ── DATOS ──
// Cada ejercicio: [nombre, nivel (1 básico · 4 experto), qué es, cómo se hace, patrón mano izquierda, patrón mano derecha, tempo inicial (bpm)]
// Patrones: dedos del 1 (pulgar) al 5 (meñique), uno por pulso, separados por espacios. Juntos = a la vez (13). Un punto = pulso de descanso.

<script>
/* ================= DEDOS ================= */
(function(){
"use strict";
const $ = (s, el)=> (el || document).querySelector(s);
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s=> String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const NFILL = { 1: '#c9efd1', 2: '#fff0b3', 3: '#ffd2a8', 4: '#ffb4b4' };
const NLAB = { 1: 'Básico', 2: 'Intermedio', 3: 'Avanzado', 4: 'Experto' };
const isDark = c=>{ const m = /^#?([0-9a-f]{6})$/i.exec(c); if(!m) return false; const n = parseInt(m[1], 16); return (((n >> 16) * 299) + (((n >> 8) & 255) * 587) + ((n & 255) * 114)) / 1000 < 140; };
const dkey = d=> d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const clamp = (v, a, b)=> Math.max(a, Math.min(b, v));
const gcd = (a, b)=> b ? gcd(b, a % b) : a;

/* --- ejercicios con su familia --- */
const ALL = [];
DATA.forEach(f=> f.subs.forEach(s=> s.items.forEach(a=>{ ALL.push({ n: a[0], l: a[1], d: a[2], h: a[3], L: a[4], R: a[5], bpm0: a[6], f, s }); })));
const BYN = new Map(); ALL.forEach(x=> BYN.set(x.n, x));
const RCOL = ['#2979ff','#ff5722','#2ecc40','#aa00ff','#ffb300','#00b8d4','#e91e63','#6d4c41','#546e7a'];

/* --- guardado local --- */
const load = (k, d)=>{ try{ const v = JSON.parse(localStorage.getItem(k) || 'null'); return v && typeof v === 'object' && !Array.isArray(v) ? v : d; }catch(e){ return d; } };
const put = (k, v)=>{ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const dirty = ()=> window.ddDirty && window.ddDirty();
const RK = 'dd_routines', CK = 'dd_checks', TK = 'dd_tempo', GK = 'dd_log';
const normItem = x=> typeof x === 'string' ? x : x && x.h === 1 ? { h: 1, t: String(x.t || '') } : x && x.h === 2 ? { h: 2, t: String(x.t || ''), d: String(x.d || '') } : null;
const normR = r=> ({ name: String(r && r.name || ''), color: String(r && r.color || '#bdbdbd'), items: Array.isArray(r && r.items) ? r.items.map(normItem).filter(x=> x !== null) : [], note: String(r && r.note || ''), o: +(r && r.o) || 0 });
let routines = load(RK, null);
if(!routines){ routines = {}; Object.entries(ROUTINES_SEED).forEach(([id, r])=> routines[id] = normR(r)); put(RK, routines); }
else Object.keys(routines).forEach(id=> routines[id] = normR(routines[id]));
let checks = load(CK, {}), tempos = load(TK, {}), logs = load(GK, {});
const rlist = ()=> Object.entries(routines).sort((a, b)=> a[1].o - b[1].o);
function saveR(){ put(RK, routines); dirty(); }
function saveChecks(){ put(CK, checks); dirty(); }
function saveT(){ put(TK, tempos); dirty(); }
function saveLog(){ put(GK, logs); dirty(); }
const undoSt = [];
function snapR(){ undoSt.push(JSON.stringify(routines)); if(undoSt.length > 30) undoSt.shift(); }
const rName = r=> r.name || 'Rutina sin nombre';
function newRoutine(name){ const id = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), rl = rlist(); routines[id] = normR({ name, color: RCOL[rl.length % RCOL.length], items: ROUTINE_TEMPLATE, note: '', o: rl.length ? rl[rl.length - 1][1].o + 1 : 0 }); return id; }
const isDone = n=> Object.prototype.hasOwnProperty.call(checks, n);
function toggle(n){ if(isDone(n)) delete checks[n]; else checks[n] = new Date().toISOString(); saveChecks(); return isDone(n); }

function setBpm(x, v){ v = clamp(Math.round(v), 20, 300); if(v === x.bpm0) delete tempos[x.n]; else tempos[x.n] = v; saveT(); return v; }

/* --- patrones --- */
function parse(p){
  const t = String(p || '').trim().split(/\s+/).filter(Boolean).map(x=> x === '.' || x === '-' ? [] : [...x].map(Number).filter(n=> n >= 1 && n <= 5));
  return t.length ? t : [[]];
}
const FN = ['', 'pulgar', 'índice', 'medio', 'anular', 'meñique'];
const fnames = a=> a.length ? a.map(i=> FN[i]).join(' + ') : 'descanso';
function steps(x){
  const P = { L: parse(x.L), R: parse(x.R) }, a = P.L.length, b = P.R.length, n = Math.min(a * b / gcd(a, b), 32);
  return Array.from({ length: n }, (_, i)=> ({ L: P.L[i % a], R: P.R[i % b] }));
}
const patTxt = p=> parse(p).map(t=> t.length ? t.join('') : '·').join(' ');
function capOf(st){
  const same = st.L.join() === st.R.join();
  return same ? [fnames(st.L), st.L.length ? 'las dos manos' : ''] : ['izq. ' + fnames(st.L) + '  ·  der. ' + fnames(st.R), 'cada mano lo suyo'];
}

/* --- navegación --- */
const body = $('#body'), qIn = $('#q');
const TABN = { m: 'Manos', e: 'Ejercicios', r: 'Rutinas' };
let tab0 = 'e'; try{ const v = localStorage.getItem('dd_tab'); if(v === 'm' || v === 'r' || v === 'e') tab0 = v; }catch(e){}
let stack = [{ t: 'root', ty: tab0 }], pos = 0, q = '', filt = { l: null, pend: false };

const ty = ()=> cur().ty;
function go(s){ if(!s.ty) s.ty = ty(); stack = stack.slice(0, pos + 1); stack.push(s); pos++; render(true); }

function fwd(){ if(pos < stack.length - 1){ pos++; render(true); } }

function crumb(){
  const s = cur(), c = $('.crumb');
  const root = `<a data-v="home">${esc(TABN[s.ty].toUpperCase())}</a>`;
  c.innerHTML = s.t === 'root' ? esc(TABN[s.ty].toUpperCase()) : s.t === 'fam' ? root + '<i>›</i>' + esc(DATA.find(f=> f.id === s.id).name) : s.t === 'all' ? root + '<i>›</i>Todos' : root + '<i>›</i>Búsqueda';
  $('[data-v=back]').disabled = pos === 0; $('[data-v=fwd]').disabled = pos >= stack.length - 1;
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('on', b.dataset.tab === s.ty));
  try{ localStorage.setItem('dd_tab', s.ty); }catch(e){}
}
function render(anim){
  crumb(); body.scrollTop = 0;
  const s = cur();
  if(s.t === 'root') (s.ty === 'r' ? renderRut() : s.ty === 'm' ? renderManos() : renderRoot()); else if(s.t === 'fam') renderFam(DATA.find(f=> f.id === s.id)); else if(s.t === 'all') renderAll(); else renderSearch();

/* --- portada de Ejercicios --- */

const row = (attr, sq, name, n, d)=> `<button class="row" ${attr}><span class="sq" style="${sq}"></span><span class="rn">${esc(name)}</span><span class="rs">${n}${d ? ' · ✓' + d : ''}</span>${CHEV}</button>`;

  const done = ALL.filter(x=> isDone(x.n)).length;
  const rows = DATA.map(f=>{ const it = ALL.filter(x=> x.f === f); return row(`data-fam="${f.id}"`, 'background:' + f.color, f.name, it.length, it.filter(x=> isDone(x.n)).length); }).join('');

}

/* --- portada de Manos --- */
function renderManos(){
  const days = new Set(Object.values(logs).map(l=> l.d)), L = 'DLMXJVS', t = dkey(new Date());
  let strip = '';
  for(let i = 13; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate() - i); const k = dkey(d); strip += `<span class="${days.has(k) ? 'on' : ''}${k === t ? ' hoy' : ''}"><i></i>${L[d.getDay()]}</span>`; }

  while(days.has(dkey(d))){ st++; d.setDate(d.getDate() - 1); }

  body.innerHTML = `<div class="page"><div class="lh">Manos<small>${nSes} ${nSes === 1 ? 'sesión' : 'sesiones'}</small></div>
    <div class="padbox"><div class="padwrap" id="padm">${HANDS}</div><div class="padinfo" id="padinfo"><b>Tus manos</b><span>Toca un dedo para ver cómo es. Para ver un ejercicio en las manos, pulsa ▶ en su ficha.</span></div></div>
    <div class="list"><div class="days">${strip}</div><div class="streak">${st ? 'Racha de ' + st + (st === 1 ? ' día' : ' días') + (days.has(t) ? ' · hoy hecho' : '') : 'Sin racha todavía. Empieza una rutina en Rutinas.'}</div></div></div>`;
  $('#padm svg').classList.add('tap');
}

}

function card(x, showFam, ri){
  const d = isDone(x.n), inR = ri != null;

const play = $('#play'); let pl = null;
function openPlay(name){
  const x = BYN.get(name); if(!x) return;
  const st = steps(x), bpm = bpmOf(x);
  play.innerHTML = `<div class="pk" role="dialog"><div class="pkh"><span>${esc(name)}</span><button data-plx="1">Cerrar</button></div><div class="padwrap">${HANDS}</div>
    <div class="plcap"></div><div class="plkeys"></div><div class="pldots">${st.map((_, i)=> `<i data-i="${i}"></i>`).join('')}</div>
    <div class="plctl"><button data-pl="prev" aria-label="Paso anterior">‹</button><button data-pl="toggle" class="pltog" aria-label="Pausa">❚❚</button><button data-pl="next" aria-label="Paso siguiente">›</button><span class="sep"></span>${[1, .5, .25].map(s=> `<button class="chip${s === 1 ? ' on' : ''}" data-spd="${s}">${s === 1 ? '1×' : s === .5 ? '½×' : '¼×'}</button>`).join('')}</div>
    <div class="plhint">1× = ${bpm} bpm, tu tempo · manos sobre la mesa, vistas desde arriba</div></div>`;
  play.classList.add('open');
  pl = { steps: st, i: -1, spd: 1, run: true, t: 0, ms: 60000 / bpm, svg: $('svg', play) };
  plNext();
}
function plShow(i){
  pl.i = i; const st = pl.steps[i];
  paint(pl.svg, st, pl.run ? pl.steps[(i + 1) % pl.steps.length] : null);
  const c = capOf(st); $('.plcap', play).textContent = c[0]; $('.plkeys', play).textContent = c[1] || ' ';
  play.querySelectorAll('.pldots i').forEach((d, k)=> d.classList.toggle('on', k === i));
}
function plNext(){ if(!pl) return; clearTimeout(pl.t); plShow((pl.i + 1) % pl.steps.length); if(pl.run) pl.t = setTimeout(plNext, pl.ms / pl.spd); }
function plSetRun(r){ pl.run = r; $('.pltog', play).textContent = r ? '❚❚' : '▶'; clearTimeout(pl.t); if(r) pl.t = setTimeout(plNext, pl.ms / pl.spd); else plShow(pl.i); }
function closePlay(){ if(!play.classList.contains('open')) return; if(pl) clearTimeout(pl.t); pl = null; play.classList.remove('open'); play.innerHTML = ''; }
play.addEventListener('click', e=>{
  if(e.target === play || e.target.closest('[data-plx]')){ closePlay(); return; }
  if(!pl) return;
  const b = e.target.closest('[data-pl]'), s = e.target.closest('[data-spd]'), dot = e.target.closest('.pldots i');
  if(s){ pl.spd = +s.dataset.spd; play.querySelectorAll('[data-spd]').forEach(c=> c.classList.toggle('on', c === s)); if(pl.run){ clearTimeout(pl.t); pl.t = setTimeout(plNext, pl.ms / pl.spd); } return; }
  if(dot){ plSetRun(false); plShow(+dot.dataset.i); return; }
  if(!b) return;
  const a = b.dataset.pl, n = pl.steps.length;
  if(a === 'toggle'){ plSetRun(!pl.run); return; }
  plSetRun(false);
  plShow(a === 'next' ? (pl.i + 1) % n : (pl.i - 1 + n) % n);
});

/* --- sesión: recorre una rutina con metrónomo, temporizador y las manos --- */
const ses = $('#ses'); let S = null;
let ac = null, muted = false, nextT = 0, kb = 0, vq = [], last = 0, lock = null;
function audio(){ if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ ac = null; } } if(ac && ac.state === 'suspended') ac.resume().catch(()=>{}); }
const now = ()=> ac ? ac.currentTime : performance.now() / 1000;
function click(t, acc){
  if(!ac || muted) return;
  const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = acc ? 1500 : 950;
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(acc ? .6 : .32, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .07);
}
async function wake(on){ try{ if(on && navigator.wakeLock && !lock){ lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', ()=> lock = null); } else if(!on && lock){ await lock.release(); lock = null; } }catch(e){} }
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'visible' && S && S.phase !== 'done') wake(true); });
function sesItems(r){
  const out = []; let sec = '', grp = [];
  const flush = ()=>{ const m = /(\d+(?:[.,]\d+)?)\s*min/i.exec(sec), tot = m ? parseFloat(m[1].replace(',', '.')) * 60 : 0; grp.forEach(it=> it.secs = tot ? Math.max(15, Math.round(tot / grp.length)) : 60); grp = []; };
  r.items.forEach(x=>{ if(typeof x === 'string'){ const e = BYN.get(x); if(e){ const it = { x: e, sec: sec.replace(/\s*·.*$/, ''), secs: 60 }; out.push(it); grp.push(it); } } else if(x.h === 1){ flush(); sec = x.t; } });
  flush(); return out;
}
function startSes(rid){
  const r = routines[rid]; if(!r) return;
  const items = sesItems(r);
  if(!items.length){ toast('Esta rutina no tiene ejercicios'); return; }
  audio(); closePlay();
  S = { rid, name: rName(r), items, i: 0, phase: 'prep', left: 0, running: false, t0: Date.now(), done: {} };
  ses.innerHTML = `<div class="pk" role="dialog"><div class="pkh"><span>${esc(S.name)}</span><button data-sx="1">Terminar</button></div><div id="sbody"></div></div>`;
  ses.classList.add('open'); wake(true); startEx();
}
function sesHTML(){
  const it = S.items[S.i];
  return `<div class="ssec">${esc(it.sec || 'ejercicio')} · ${S.i + 1}/${S.items.length}</div><div class="sname">${esc(it.x.n)}</div><div class="sdesc">${esc(it.x.h)}</div>
    <div class="padwrap">${HANDS}</div><div class="plcap"></div><div class="plkeys"></div>
    <div class="stimer prep">4</div>
    <div class="plctl" id="sctl"><button data-s="prev" aria-label="Ejercicio anterior">‹</button><button data-s="toggle" class="stog" aria-label="Pausa">❚❚</button><button data-s="next" aria-label="Siguiente">›</button><span class="sep"></span><button data-s="dn" aria-label="Más lento">−</button><span class="bpmv"><span id="bv">${bpmOf(it.x)}</span> <small>bpm</small></span><button data-s="up" aria-label="Más rápido">+</button></div>
    <div class="srate" id="srate"><p>¿Cómo ha salido?</p><div class="chips"><button class="chip" data-rate="-1">Con fallos · −5</button><button class="chip" data-rate="0">Bien</button><button class="chip" data-rate="1">Limpio · +5</button></div>
      <div class="chips"><button class="chip${isDone(it.x.n) ? ' on' : ''}" data-sck="1">✓ Ya lo tengo automatizado</button></div></div>
    <div class="pldots">${S.items.map((x, k)=> `<i class="${k === S.i ? 'on' : S.done[k] != null ? 'ok' : ''}"></i>`).join('')}</div>
    <div class="plhint"><button class="chip" data-s="mute">${muted ? '♪ sin sonido' : '♪ con sonido'}</button></div>`;
}
function startEx(){
  const sb = $('#sbody', ses); sb.innerHTML = sesHTML();
  S.svg = $('svg', sb); S.st = steps(S.items[S.i].x);
  S.phase = 'prep'; S.left = S.items[S.i].secs; S.running = true; kb = 0; vq = []; nextT = now() + .2;
  paint(S.svg, null, S.st[0]); const c = capOf(S.st[0]); $('.plcap', sb).textContent = 'empieza: ' + c[0]; $('.plkeys', sb).textContent = c[1] || ' ';
}
setInterval(()=>{
  if(!S || !S.running || S.phase === 'rate' || S.phase === 'done') return;
  const spb = 60 / bpmOf(S.items[S.i].x), n = S.st.length;
  while(nextT < now() + .12){ const run = kb >= 4; click(nextT, run ? (kb - 4) % n === 0 : kb === 0); vq.push({ t: nextT, k: kb }); kb++; nextT += spb; }
}, 25);
function frame(ts){
  requestAnimationFrame(frame);
  const dt = last ? (ts - last) / 1000 : 0; last = ts;
  if(!S || !S.running) return;
  const sb = $('#sbody', ses), tm = $('.stimer', sb), n = now();
  while(vq.length && vq[0].t <= n){
    const v = vq.shift();
    if(v.k < 4){ S.phase = 'prep'; tm.textContent = 4 - v.k; tm.classList.add('prep'); }
    else{ if(S.phase !== 'run'){ S.phase = 'run'; tm.classList.remove('prep'); } const b = v.k - 4, st = S.st[b % S.st.length]; paint(S.svg, st, S.st[(b + 1) % S.st.length]); const c = capOf(st); $('.plcap', sb).textContent = c[0]; $('.plkeys', sb).textContent = c[1] || ' '; }
  }
  if(S.phase === 'run'){ S.left -= dt; if(S.left <= 0){ toRate(); return; } const s = Math.ceil(S.left); tm.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
}
requestAnimationFrame(frame);
function toRate(){ S.running = false; S.phase = 'rate'; vq = []; paint(S.svg); const sb = $('#sbody', ses); $('.plcap', sb).textContent = ''; $('.plkeys', sb).textContent = ' '; $('.stimer', sb).textContent = '0:00'; $('.stimer', sb).classList.remove('prep'); $('#sctl', sb).style.display = 'none'; $('#srate', sb).classList.add('on'); }
function sesPause(){
  if(S.phase === 'rate' || S.phase === 'done') return;
  const t = $('.stog', ses);
  if(S.running){ S.running = false; vq = []; t.textContent = '▶'; }
  else{ audio(); S.running = true; if(S.phase === 'prep') kb = 0; nextT = now() + .15; t.textContent = '❚❚'; }
}
function sesNext(){ S.i++; if(S.i >= S.items.length) sesFinish(); else { audio(); startEx(); } }
function sesFinish(){
  S.running = false; S.phase = 'done'; vq = []; wake(false);
  const min = Math.max(1, Math.round((Date.now() - S.t0) / 60000)), n = Object.keys(S.done).length;
  if(n){ logs[Date.now().toString(36)] = { d: dkey(new Date()), r: S.name, n, m: min }; saveLog(); }
  $('#sbody', ses).innerHTML = `<div class="sdone"><div class="ssec">hecho</div><div class="big">${min} min</div><div class="sdesc">${n ? n + (n === 1 ? ' ejercicio' : ' ejercicios') + ' · los tempos ya están ajustados para la próxima' : 'No se ha guardado nada'}</div><div class="chips" style="justify-content:center;padding-top:8px"><button class="chip go" data-sx="1">Cerrar</button></div></div>`;
}
function closeSes(){ S = null; vq = []; wake(false); ses.classList.remove('open'); ses.innerHTML = ''; rerender(); }
ses.addEventListener('click', e=>{
  if(!S) return;
  if(e.target.closest('[data-sx]')){ if(S.phase === 'done' || !Object.keys(S.done).length) closeSes(); else sesFinish(); return; }
  const s = e.target.closest('[data-s]'), r = e.target.closest('[data-rate]');
  if(e.target.closest('[data-sck]')){ const on = toggle(S.items[S.i].x.n); e.target.closest('[data-sck]').classList.toggle('on', on); toast(on ? 'Automatizado' : 'Desmarcado'); return; }
  if(r){ const x = S.items[S.i].x, v = +r.dataset.rate; S.done[S.i] = v; setBpm(x, bpmOf(x) + v * 5); sesNext(); return; }
  if(!s) return;
  const a = s.dataset.s, x = S.items[S.i].x;
  if(a === 'toggle') sesPause();
  if(a === 'next') toRate();
  if(a === 'prev'){ if(S.i > 0) S.i--; audio(); startEx(); }
  if(a === 'dn' || a === 'up'){ $('#bv', ses).textContent = setBpm(x, bpmOf(x) + (a === 'up' ? 5 : -5)); }
  if(a === 'mute'){ muted = !muted; s.textContent = muted ? '♪ sin sonido' : '♪ con sonido'; }
});

/* --- pestaña Rutinas --- */
const nCards = r=> r.items.filter(x=> typeof x === 'string').length;
const HB = (i, first)=> `<span class="hacts"><button data-hadd="${i}" title="Añadir ejercicios aquí" aria-label="Añadir ejercicios aquí">+</button>${first ? '' : `<button data-up="${i}" title="Subir" aria-label="Subir">↑</button>`}<button data-rm="${i}" title="Quitar" aria-label="Quitar">×</button></span>`;
function renderRut(){
  const rl = rlist();
  let h = `<div class="page"><div class="chips" style="padding-top:6px"><span class="rcount">${rl.length} rutina${rl.length === 1 ? '' : 's'}</span><button class="chip" data-undo="1" style="margin-left:auto"${undoSt.length ? '' : ' disabled'}>↶ Deshacer</button></div>`;
  if(!rl.length) h += `<div class="empty">No hay rutinas. Crea una abajo.</div>`;
  rl.forEach(([id, r])=>{
    let inner = '', grid = [];
    const flush = ()=>{ if(grid.length){ inner += `<div class="grid">${grid.join('')}</div>`; grid = []; } };
    r.items.forEach((x, i)=>{
      if(typeof x === 'string'){ const e = BYN.get(x); if(e) grid.push(card(e, false, i)); return; }
      flush();
      if(x.h === 1) inner += `<div class="rh1" data-ii="${i}"><input class="rt1" data-hed="t" value="${esc(x.t)}" placeholder="título…" autocomplete="off" spellcheck="false">${HB(i, i === 0)}</div>`;
      else inner += `<div class="rh2" data-ii="${i}"><div class="rh2a"><input class="rt2" data-hed="t" value="${esc(x.t)}" placeholder="ejercicio…" autocomplete="off" spellcheck="false">${HB(i, i === 0)}</div><textarea class="rd2" data-hed="d" rows="1" placeholder="explicación…">${esc(x.d)}</textarea></div>`;
    });
    flush();
    const nc = nCards(r);
    h += `<div class="blk" data-rid="${id}" style="background:${r.color}29;border:1px solid ${r.color}8c">
      <div class="bh"><button class="dot" data-rcol="1" style="background:${r.color}" title="Cambiar color" aria-label="Cambiar color"></button><input class="bn" data-rname="1" value="${esc(r.name)}" placeholder="nombre de la rutina…" autocomplete="off" spellcheck="false"><span class="bc">${nc}</span>${nc ? `<button class="chip go" data-rgo="1">▶ Empezar</button>` : ''}<button class="chip" data-rdel="1" title="Borrar rutina" aria-label="Borrar rutina">×</button></div>
      ${inner}
      <div class="chips" style="padding-top:10px"><button class="chip" data-radd="1">+ ejercicios</button><button class="chip" data-rh="1">+ título</button><button class="chip" data-rh="2">+ subtítulo</button></div>
      <textarea class="bnote" data-rnote="1" placeholder="notas, objetivos…">${esc(r.note)}</textarea></div>`;
  });
  h += `<button class="chip" data-rnew="1" style="margin:12px 0;padding:10px 16px !important;font-weight:700">+ nueva rutina</button>`;
  body.innerHTML = h + '</div>';
  body.querySelectorAll('.rd2').forEach(fit);
}
function fit(ta){ ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
function sectionEnd(r, i){
  const lv = r.items[i].h;
  for(let j = i + 1; j < r.items.length; j++){ const x = r.items[j]; if(typeof x !== 'string' && x.h <= lv) return j; }
  return r.items.length;
}
function addTo(id, n){
  const r = routines[id]; if(!r) return;
  snapR(); r.items.push(n); saveR(); toast('Añadido al final de ' + rName(r));
  if(ty() === 'r') rerender();
}
function addFlow(n, btn){
  const rl = rlist();
  if(!rl.length){ snapR(); const id = newRoutine('Mi rutina'); routines[id].items.push(n); saveR(); toast('Añadido a Mi rutina'); return; }
  if(rl.length === 1){ addTo(rl[0][0], n); return; }
  menu.innerHTML = `<div style="padding:8px 14px 4px;font-size:13px;opacity:.55">Añadir al final de…</div>` + rl.map(([id, r])=> `<button data-addto="${id}" data-addn="${esc(n)}"><span style="display:inline-block;width:12px;height:12px;border-radius:4px;background:${r.color};margin-right:10px;vertical-align:-1px"></span>${esc(rName(r))}${r.items.includes(n) ? ' ✓' : ''}</button>`).join('');
  const b = btn.getBoundingClientRect(); menu.classList.add('open');
  const w = menu.offsetWidth, hh = menu.offsetHeight;
  menu.style.left = Math.max(8, Math.min(innerWidth - w - 8, b.right - w)) + 'px';
  menu.style.top = Math.max(8, b.bottom + 6 + hh > innerHeight ? b.top - hh - 6 : b.bottom + 6) + 'px';

/* --- elegir ejercicios para una rutina --- */
const pick = $('#pick'); let pickId = null, pickQ = '', pickAt = 0, pickWhere = '';
function openPick(id, at, where){
  pickId = id; pickQ = ''; pickAt = at; pickWhere = where || '';
  pick.innerHTML = `<div class="pk" role="dialog"><div class="pkh"><span></span><button data-pkx="1">Listo</button></div><div class="pks"><input type="search" id="pkq" placeholder="buscar ejercicio…" autocomplete="off" spellcheck="false"></div><div class="pkl" id="pkl"></div></div>`;
  pick.classList.add('open'); drawPick();
}
function drawPick(){
  const r = routines[pickId]; if(!r){ closePick(); return; }
  $('.pkh span', pick).textContent = 'Añadir a ' + (pickWhere ? '«' + pickWhere + '»' : '«' + rName(r) + '»');
  const qq = norm(pickQ.trim()), hit = x=> !qq || norm(x.n).includes(qq) || norm(x.d).includes(qq);
  const sec0 = r.items.slice(0, pickAt);
  const prow = x=>{ const li = sec0.lastIndexOf(x.n), inn = li > -1 && sec0.slice(li).every(y=> typeof y === 'string'); return `<button class="prow${inn ? ' in' : ''}" data-pn="${esc(x.n)}"><span class="pd" style="background:${NFILL[x.l]}"></span><span class="pn">${esc(x.n)}<small>${esc(NLAB[x.l])}</small></span><span class="pi">${inn ? '✓' : '+'}</span></button>`; };
  const h = DATA.map(f=>{ const its = ALL.filter(x=> x.f === f && hit(x)); return its.length ? `<div class="pkt">${esc(f.name)}</div>` + its.map(prow).join('') : ''; }).join('');
  $('#pkl').innerHTML = h || `<div class="empty">Nada con «${esc(pickQ)}».</div>`;
}
function closePick(){ if(!pick.classList.contains('open')) return; pick.classList.remove('open'); pick.innerHTML = ''; pickId = null; if(ty() === 'r') rerender(); }
pick.addEventListener('click', e=>{
  if(e.target === pick || e.target.closest('[data-pkx]')){ closePick(); return; }
  const p = e.target.closest('[data-pn]'); if(!p) return;
  const r = routines[pickId], n = p.dataset.pn; if(!r) return;
  let j = -1; for(let k = pickAt - 1; k >= 0 && typeof r.items[k] === 'string'; k--) if(r.items[k] === n){ j = k; break; }
  snapR();
  if(j >= 0){ r.items.splice(j, 1); pickAt--; toast('Quitado'); } else { r.items.splice(pickAt, 0, n); pickAt++; toast('Añadido'); }
  saveR(); const y = $('#pkl').scrollTop; drawPick(); $('#pkl').scrollTop = y;
});
pick.addEventListener('input', e=>{ if(e.target.id === 'pkq'){ pickQ = e.target.value; drawPick(); } });

/* --- una familia --- */
function renderFam(f){
  let h = `<div class="page"><div class="fh" style="background:${f.color};color:${isDark(f.color) ? '#fff' : '#1c1c1e'}">${esc(f.name)}</div><div class="fd">${esc(f.desc)}</div>${chipsHTML()}`, shown = 0;
  f.subs.forEach(s=>{
    const its = ALL.filter(x=> x.s === s && passes(x)); if(!its.length) return; shown += its.length;

  });
  if(!shown) h += `<div class="empty">Nada con estos filtros.</div>`;
  body.innerHTML = h + '</div>';

/* --- todos, de fácil a difícil --- */
function renderAll(){
  const its = ALL.filter(passes).sort((a, b)=> a.l - b.l);
  let h = `<div class="page"><div class="lh">Todos los ejercicios<small>${its.length}</small></div>${chipsHTML()}`;
  h += its.length ? `<div class="grid">${its.map(x=> card(x, true)).join('')}</div>` : `<div class="empty">Nada con estos filtros.</div>`;
  body.innerHTML = h + '</div>';
}

/* --- búsqueda --- */
function renderSearch(){
  const qq = norm(q.trim()), hit = x=> !qq || norm(x.n).includes(qq) || norm(x.d).includes(qq) || norm(x.h).includes(qq);

  });
  if(!shown) h += `<div class="empty">Nada con «${esc(q)}».</div>`;

/* --- menú ⋯ --- */
const menu = $('#menu');

function openMenu(btn){

  const dark = document.documentElement.classList.contains('dark');

<script>
/* ================= GUARDADO EN GITHUB =================
   Los automatizados, las rutinas, los tempos y las sesiones viven en dedos-datos.json dentro de tu repositorio.
   Al cambiar algo se sube a los pocos segundos; al abrir la app se baja lo último. Si dos aparatos cambian a la vez, se juntan. */
(function(){
"use strict";
const $ = (s, e)=> (e || document).querySelector(s);

const apiBase = ()=> (gh && gh.api) || 'https://api.github.com';

document.body.appendChild(cloud);
function titleOf(v){
  return { ok: 'Guardado en GitHub', sync: 'Guardando…', pending: 'Cambios por guardar', off: 'Sin conexión: se guardará al volver', err: 'No se pudo guardar' + (lastMsg ? ': ' + lastMsg : ''), none: 'Sin conectar: toca para guardar en GitHub' }[v] || '';

/* ---------- API de GitHub ---------- */
let trace = [];
function note(t){ trace.push(new Date().toLocaleTimeString('es-ES') + ' ' + t); if(trace.length > 6) trace.shift(); const d = $('#mlg-trace'); if(d) d.textContent = trace.join('\n'); }
async function ghApi(path, opt){
  opt = opt || {};

function loadBase(){ try{ return JSON.parse(localStorage.getItem(BASEK) || 'null'); }catch(e){ return null; } }

const isMap = o=> o && typeof o === 'object' && !Array.isArray(o);
const sortMap = (m, f)=>{ const o = {}; Object.keys(isMap(m) ? m : {}).sort().forEach(k=> o[k] = f ? f(m[k]) : m[k]); return o; };
const snap = ()=>{ const d = window.ddData(); return { c: sortMap(d.c, v=> v || ''), r: sortMap(d.r, window.ddNormR), t: sortMap(d.t), g: sortMap(d.g) }; };

/* ---------- fusión a tres bandas: lo último común (b), lo de aquí (l) y lo de GitHub (r) ---------- */
function mapMerge(b, l, r){
  const out = {}; l = l || {}; r = r || {};

  });

/* ---------- sincronizar ---------- */

      if(!r.ok && r.status !== 404) throw new Error('lectura ' + r.status);

        let o = null; try{ o = JSON.parse(txt); }catch(e){}

    if(again){ again = false; scheduleSync(300); }
  }
}
addEventListener('online', ()=> scheduleSync(200));

/* ---------- panel: conectar con GitHub ---------- */

      if(j.permissions && !j.permissions.push) return openGh('La llave puede leer pero no escribir. En la llave, el permiso «Contents» tiene que estar en «Read and write».');
      const same = gh && gh.owner === cand.owner && gh.repo === cand.repo && (gh.dir || '') === cand.dir;
      gh = Object.assign({}, cand, { branch: j.default_branch || 'main' });
      localStorage.setItem(CFG, S(gh));
      if(!same) localStorage.removeItem(BASEK);
      firstMode = null;
      if(!loadBase()){
        const fr = await ghApi('/contents/' + dirp() + FILE + '?ref=' + encodeURIComponent(gh.branch));
        if(fr.ok) firstMode = confirm('En GitHub ya hay datos de DEDOS guardados.\n\nAceptar: usar en este aparato los de GitHub (lo que haya aquí se sustituye).\nCancelar: juntar lo de este aparato con lo de GitHub.') ? 'replace' : 'merge';
      }
      closeGh(); toast('Conectado con GitHub'); setState('pending'); sync();
    }catch(err){ openGh('No hay conexión con GitHub. Comprueba internet y vuelve a probar.'); }
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && panel.classList.contains('open')) closeGh(); });
cloud.addEventListener('click', ()=> openGh());
setState(ghOk() ? 'pending' : 'none'); if(ghOk()) sync();
window.ddSync = { sync, openGh, state: ()=> state };
})();
</script>
