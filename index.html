body{position:fixed;inset:0;overflow:hidden;background:#fff;color:#1c1c1e;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.3;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-user-select:none;user-select:none;
  --dot:rgba(0,0,0,.2);--panel:rgba(255,255,255,.94);--b:rgba(0,0,0,.09);--h:rgba(0,0,0,.06);--sel:#2f8cf5;--solid:#fff;--ink:#1c1c1e;--capon:#d6e8fe;}
:root.dark body{background:#1b1b1d;color:#ececec;--dot:rgba(255,255,255,.16);--panel:rgba(44,44,46,.95);--b:rgba(255,255,255,.12);--h:rgba(255,255,255,.09);--solid:#2c2c2e;--ink:#ececec;--capon:#1d3d63;}
button,input{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;}
svg{display:block;}
#app{position:absolute;inset:0;display:flex;flex-direction:column;}

/* barra superior */
.top{display:flex;flex-wrap:wrap;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 54px 8px 10px;align-items:center;flex-shrink:0;z-index:2;}
.bar{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.12),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);min-width:0;}
.bt{height:36px;min-width:36px;padding:0 10px !important;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bt:hover{background:var(--h);}
.bt:disabled{opacity:.3;cursor:default;}
.bt svg{width:20px;height:20px;}
.crumb{padding:0 8px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw;}
.crumb i{font-style:normal;opacity:.4;margin:0 5px;}
.crumb a{cursor:pointer;}
.search{display:flex;align-items:center;gap:4px;flex:1 1 150px;min-width:130px;}
.search input{flex:1;min-width:0;height:36px;padding:0 8px !important;font-size:16px;outline:none;cursor:text !important;-webkit-user-select:text;user-select:text;}

.tabs{display:flex;gap:6px;padding:0 10px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{padding:7px 13px !important;flex-shrink:0;border-radius:16px;background:var(--h) !important;font-weight:600;white-space:nowrap;}
.tab.on{background:var(--sel) !important;color:#fff !important;}
/* cuerpo */
.body{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;}
.in{animation:in .22s ease-out;}
@keyframes in{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:none;}}
.page{width:100%;padding:6px 12px 110px;}
.lh{font-size:22px;font-weight:800;padding:6px 4px 10px;}
.lh small{font-size:13px;font-weight:500;opacity:.55;margin-left:10px;}
.list{background:var(--panel);border-radius:14px;box-shadow:0 0 0 .5px var(--b);overflow:hidden;}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px !important;text-align:left;border-bottom:.5px solid var(--b) !important;}
.row:last-child{border-bottom:0 !important;}
.row:hover{background:var(--h);}
.row .rn{flex:1;font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .rs{opacity:.5;font-size:13px;white-space:nowrap;}
.sq{width:28px;height:28px;border-radius:8px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.fh{border-radius:16px;padding:16px 18px;font-size:28px;font-weight:800;margin:6px 0 4px;}
.fd{opacity:.6;padding:0 4px 8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 8px;}
.chip{padding:6px 12px !important;border-radius:14px;background:var(--h) !important;font-size:14px;}
.chip.on{background:var(--sel) !important;color:#fff !important;}
.chip.go{background:var(--sel) !important;color:#fff !important;font-weight:700;}
.chips .sep{width:1px;background:var(--b);margin:0 4px;}
.sf{margin:14px 0 6px;font-size:18px;font-weight:700;display:flex;align-items:baseline;gap:8px;}
.sf small{opacity:.5;font-weight:500;font-size:13px;}
.sf a{cursor:pointer;border-radius:8px;padding:2px 10px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
.card{position:relative;border-radius:10px;padding:10px 12px 12px;padding-right:46px;min-height:84px;color:#1c1c1e;box-shadow:0 1px 2px rgba(0,0,0,.12);border:1px solid rgba(0,0,0,.06);cursor:pointer;}
.card:active{filter:brightness(.96);}
.card b{display:block;font-size:15px;}
.card .an{display:block;font-size:13px;opacity:.75;margin-top:3px;line-height:1.3;}
.card .sb{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.05em;opacity:.55;margin-top:6px;}
.card .sb2{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;margin-top:4px;line-height:1.3;}
.card .sb2 span{opacity:.85;padding-top:1px;}
.card .sb2 i{display:inline-flex;gap:3px;flex-shrink:0;font-style:normal;}
.card .sb2 i b{display:inline-block;min-width:30px;text-align:center;font-size:10px;font-weight:700;letter-spacing:.03em;line-height:1;padding:3px 5px;border-radius:5px;color:#fff;}
.card .sb2 .iz{background:#6a4fb3;}
.card .sb2 .de{background:#0070d1;}
.card .sb2 .am{background:#8e8e93;}
.card .sb2 .po{background:linear-gradient(90deg,#34c759,#0a84ff,#ff9500,#af52de);}
.card .acts{position:absolute;right:6px;top:6px;display:flex;flex-direction:column;gap:4px;}
.card .acts button{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;background:rgba(255,255,255,.55);color:#1c1c1e;}
.card .acts button:hover{background:rgba(255,255,255,.9);}
.card .acts button.on{background:#34c759;color:#fff;}
.card .acts button.fav{font-size:16px;}
.card .acts button.fav.on{background:#ffd400;color:#1c1c1e;}
.card .acts button.pl{background:#2f8cf5;color:#fff;font-size:12px;}
/* rutinas */
.blk{border-radius:16px;padding:10px;margin:10px 0 14px;}
.bh{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.dot{width:26px;height:26px;border-radius:50% !important;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.bn{flex:1;min-width:0;font-size:17px !important;font-weight:700;outline:none;padding:4px 2px !important;cursor:text !important;-webkit-user-select:text;user-select:text;}
.bc{opacity:.55;font-size:13px;white-space:nowrap;}
.bnote{display:block;width:100%;margin-top:10px;min-height:56px;border-radius:10px;border:1px solid var(--b);background:var(--panel);color:inherit;padding:8px 10px;font:inherit;font-size:14px;resize:vertical;outline:none;-webkit-user-select:text;user-select:text;}
.chip:disabled{opacity:.35;cursor:default;}
.rcount{opacity:.55;font-size:14px;align-self:center;padding-left:4px;}
.blk input,.blk textarea{cursor:text !important;-webkit-user-select:text;user-select:text;}
.rh1{display:flex;align-items:center;gap:6px;margin:16px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--b);}
.rt1{flex:1;min-width:0;font-size:19px !important;font-weight:800;outline:none;padding:2px !important;}
.rh2{margin:10px 0 6px;padding:8px 10px;border-radius:12px;background:var(--panel);box-shadow:0 0 0 .5px var(--b);}
.rh2a{display:flex;align-items:center;gap:6px;}
.rt2{flex:1;min-width:0;font-size:16px !important;font-weight:700;outline:none;padding:2px !important;}
.rd2{display:block;width:100%;font:inherit;font-size:14px;line-height:1.35;opacity:.75;resize:none;overflow:hidden;background:transparent;border:0;outline:none;color:inherit;padding:2px;}
.hacts{display:flex;gap:4px;flex-shrink:0;}
.hacts button{width:28px;height:28px;border-radius:8px;background:var(--h);display:flex;align-items:center;justify-content:center;font-size:15px;}
.hacts button:hover{background:var(--b);}
/* días */
.days{display:flex;gap:4px;padding:12px 14px 6px;}
.days span{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;opacity:.55;}
.days span i{width:100%;max-width:22px;aspect-ratio:1;border-radius:6px;background:var(--h);}
.days span.on i{background:#34c759;}
.days span.hoy{opacity:1;font-weight:700;}
.streak{padding:0 14px 12px;font-size:13px;opacity:.6;}
/* manos */
.padbox{background:var(--panel);border-radius:16px;box-shadow:0 0 0 .5px var(--b);padding:10px 10px 12px;margin-bottom:12px;}
.padwrap{color:var(--ink);max-width:460px;margin:0 auto;}
.hd{display:block;width:100%;height:auto;}
.hd .o{fill:none;stroke:currentColor;stroke-width:4.5;stroke-linejoin:round;}
.hd .k,.hd .pm,.hd .wr{fill:var(--solid);}
.hd .k{transition:fill .08s;}
.hd .k.nx,.hd .k.sel{fill:rgba(47,140,245,.28);}
.hd .k.on{fill:#2f8cf5;}
.hd .k.on.ac{fill:#e5383b;}
.hd.poly .k.on[data-f$="1"]{fill:#ff2d55;}.hd.poly .k.on[data-f$="2"]{fill:#34c759;}.hd.poly .k.on[data-f$="3"]{fill:#0a84ff;}.hd.poly .k.on[data-f$="4"]{fill:#ff9500;}.hd.poly .k.on[data-f$="5"]{fill:#af52de;}
.pgeo{max-width:250px;margin:2px auto 0;color:var(--ink);}
.pgs{width:100%;height:auto;display:block;}
.pring{fill:none;stroke:var(--b);stroke-width:2;}
.phand{stroke:currentColor;stroke-width:2;opacity:.45;}
.phd{fill:currentColor;}
.pv{transition:r .08s;}
.pfing{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:8px 12px 2px;}
.pfc{display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;background:var(--h);padding:6px 2px;}
.pfc b{font-size:12px;filter:brightness(.85);}
.pfc.off{opacity:.45;}
.pfn{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}
.pfb{display:flex;gap:4px;}
.pfb button{width:32px;height:32px;border-radius:9px;background:var(--solid);font-weight:700;font-size:16px;}
.acc,.card .acc{display:inline;color:#e5383b;font-weight:800;font-size:inherit;}
.hd .hl{fill:currentColor;opacity:.45;font-size:12px;text-anchor:middle;}
.hd.tap .k{cursor:pointer;}
.padinfo{display:flex;flex-direction:column;gap:2px;padding:8px 6px 0;min-height:52px;}
.padinfo b{font-size:15px;}
.padinfo span{font-size:14px;opacity:.75;}
/* reproductor y sesión */
#play,#ses{position:fixed;inset:0;z-index:910;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
#play.open,#ses.open{display:flex;}
#play .pk,#ses .pk{background:var(--solid);width:100%;max-width:560px;max-height:92vh;max-height:calc(100dvh - 16px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));}
@media (min-width:600px){#play,#ses{align-items:center;}#play .pk,#ses .pk{border-radius:18px;}}
#play .padwrap,#ses .padwrap{padding:0 14px;}
.plcap{text-align:center;font-size:17px;font-weight:600;min-height:30px;padding:8px 16px 0;}
.plkeys{text-align:center;font-size:13px;opacity:.6;min-height:18px;padding:2px 16px 0;}
.plhint{text-align:center;font-size:12px;opacity:.45;padding:6px 16px 0;}
.pldots{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;padding:6px 12px 4px;}
.pldots i{width:9px;height:9px;border-radius:50%;background:var(--b);cursor:pointer;}
.pldots i.on{background:#2f8cf5;}
.pldots i.ok{background:#34c759;}
.plctl{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px 4px;flex-wrap:wrap;}
.plctl [data-pl],.plctl [data-s]{width:44px;height:40px;border-radius:12px;background:var(--h);font-size:18px;font-weight:700;}
.plctl .sep{width:1px;height:24px;background:var(--b);margin:0 6px;}
.ssec{text-align:center;font-size:12px;font-weight:700;opacity:.5;padding:2px 16px 0;text-transform:uppercase;letter-spacing:.05em;}
.sname{text-align:center;font-size:22px;font-weight:800;padding:2px 16px 0;}
.sdesc{text-align:center;font-size:14px;opacity:.65;padding:2px 20px 4px;}
.stimer{text-align:center;font-size:52px;font-weight:300;font-variant-numeric:tabular-nums;line-height:1.05;padding:4px 0 0;}
.stimer.prep{color:#2f8cf5;font-weight:600;}
.bpmv{min-width:78px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;}
.bpmv small{font-weight:500;opacity:.55;font-size:12px;}
.srate{display:none;flex-direction:column;align-items:center;gap:6px;padding:8px 12px 4px;}
.srate.on{display:flex;}
.srate p{font-size:14px;opacity:.6;}
.srate .chips{justify-content:center;padding:0;}
.srate .chip{padding:10px 14px !important;font-weight:600;}
.sdone{padding:18px 16px 8px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;}
.sdone .big{font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;}
/* elegir ejercicios */
#pick{position:fixed;inset:0;z-index:900;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
#pick.open{display:flex;}
#pick .pk{background:var(--solid);width:100%;max-width:520px;max-height:86vh;max-height:calc(100dvh - 16px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3);}
@media (min-width:600px){#pick{align-items:center;}#pick .pk{border-radius:18px;}}
.pkh{display:flex;align-items:center;gap:8px;padding:14px 14px 8px;font-weight:700;}
.pkh span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#play .pkh,#ses .pkh,#pick .pkh{position:sticky;top:0;background:var(--solid);z-index:1;}
.pkh button{padding:8px 16px !important;border-radius:10px;background:var(--sel) !important;color:#fff !important;font-weight:600;}
.pks{padding:0 14px 6px;}
.pks input{width:100%;height:38px;border-radius:10px;border:1px solid var(--b) !important;padding:0 10px !important;font-size:16px;outline:none;cursor:text !important;-webkit-user-select:text;user-select:text;}
.pkl{overflow:auto;-webkit-overflow-scrolling:touch;padding:0 8px calc(14px + env(safe-area-inset-bottom,0px));}
.pkt{font-size:13px;font-weight:700;opacity:.55;margin:12px 8px 4px;}
.prow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 8px !important;border-radius:10px;}
.prow:hover{background:var(--h);}
.prow .pd{width:14px;height:14px;border-radius:4px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);}
.prow .pn{flex:1;min-width:0;}
.prow .pn small{display:block;opacity:.55;font-size:12px;}
.prow .pi{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--h);font-weight:700;flex-shrink:0;}
.prow.in .pi{background:#34c759;color:#fff;}
.card.done{box-shadow:0 0 0 2px #34c759;}
.empty{opacity:.55;padding:40px 10px;text-align:center;}
@media (max-width:560px){.grid{grid-template-columns:1fr;}.fh{font-size:22px;}.row .rs{max-width:38vw;overflow:hidden;text-overflow:ellipsis;}}

/* metrónomo: ventana y barra de abajo */
#met{position:fixed;inset:0;z-index:920;padding-top:calc(8px + env(safe-area-inset-top,0px));display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
#met.open{display:flex;}
#met .pk{background:var(--solid);width:100%;max-width:560px;max-height:92vh;max-height:calc(100dvh - 16px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);}
@media (min-width:600px){#met{align-items:center;}#met .pk{border-radius:18px;}}
#met .pkh{position:sticky;top:0;background:var(--solid);z-index:1;}
.mb{padding:0 14px calc(18px + env(safe-area-inset-bottom,0px));}
.mbig{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 0 2px;}
.mbig button{width:46px;height:44px;border-radius:12px;background:var(--h);font-weight:700;font-size:14px;}
.mbpm{min-width:118px;text-align:center;display:flex;flex-direction:column;align-items:center;}
.mbpm b{font-size:58px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;}
.mbpm small{font-size:13px;opacity:.55;}
#m-sl{width:100%;margin:10px 0 4px;accent-color:#2f8cf5;height:28px;}
.mdots{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 0 2px;}
.mdot{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:var(--h);box-shadow:inset 0 0 0 2px var(--b);}
.mdot[data-a="3"]{box-shadow:inset 0 0 0 3px #e5383b;}
.mdot[data-a="2"]{box-shadow:inset 0 0 0 2px #2f8cf5;}
.mdot[data-a="1"]{box-shadow:inset 0 0 0 2px rgba(47,140,245,.4);opacity:.75;}
.mdot[data-a="0"]{opacity:.3;}
.mdot.on{background:#2f8cf5;color:#fff;}
.mdot.on[data-a="3"]{background:#e5383b;}
.mdot.mu{background:var(--h) !important;color:inherit !important;}
.mrow{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:14px;padding-top:4px;}
.mrow input[type=number]{width:62px;height:36px;border-radius:10px;border:1px solid var(--b) !important;padding:0 8px !important;font-size:16px;outline:none;background:transparent;cursor:text;-webkit-user-select:text;user-select:text;}
.mrow input[type=range]{flex:1;min-width:120px;accent-color:#2f8cf5;}
.mrow input[type=text]{flex:1;min-width:120px;height:36px;border-radius:10px;border:1px solid var(--b) !important;padding:0 10px !important;font-size:16px;outline:none;cursor:text;-webkit-user-select:text;user-select:text;}
.mpre{display:inline-flex;align-items:center;border-radius:14px;background:var(--h);}
.mpre .chip{background:transparent !important;}
.mpre .mpx{padding:6px 10px 6px 2px !important;opacity:.45;}
#mbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;display:none;align-items:center;gap:2px;background:var(--panel);border-radius:22px;padding:4px;box-shadow:0 2px 14px rgba(0,0,0,.18),0 0 0 .5px var(--b);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);max-width:calc(100vw - 92px);}
#mbar.open{display:flex;}
#mbar button{height:36px;min-width:34px;padding:0 8px !important;border-radius:18px;font-weight:700;}
#mbar button:hover{background:var(--h);}
#mbar .mplay{background:#2f8cf5 !important;color:#fff;}
#mbar .mbv{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;padding:0 2px;}
#mbar .mbv small{font-weight:500;opacity:.55;font-size:11px;}
#mbar .mds{display:flex;gap:3px;padding:0 6px;}
#mbar .mds i{width:8px;height:8px;border-radius:50%;background:var(--b);}
#mbar .mds i.a3{box-shadow:0 0 0 1.5px #e5383b;}
#mbar .mds i.on{background:#2f8cf5;}
#mbar .mds i.on.a3{background:#e5383b;}
#mbar .mi{font-size:12px;opacity:.55;white-space:nowrap;padding:0 4px;}
@media (max-width:420px){#mbar .mi{display:none;}#mbar .mds i{width:7px;height:7px;}}
body.hasbar .notebtn{bottom:calc(72px + env(safe-area-inset-bottom,0px));}
body.hasbar .lad{bottom:calc(138px + env(safe-area-inset-bottom,0px));}
body.hasbar .toast{bottom:calc(70px + env(safe-area-inset-bottom,0px));}
.plink.on{background:#2f8cf5 !important;color:#fff !important;}

/* editor de ejercicios: la tabla */
#edit{position:fixed;inset:0;z-index:905;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);}
#edit.open{display:flex;}
#edit .pk{background:var(--solid);width:100%;max-width:560px;max-height:92vh;max-height:calc(100dvh - 16px - env(safe-area-inset-top,0px));border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);}
@media (min-width:600px){#edit{align-items:center;}#edit .pk{border-radius:18px;}}
#edit .pkh{position:sticky;top:0;background:var(--solid);z-index:1;}
.edb{padding:0 14px calc(16px + env(safe-area-inset-bottom,0px));}
.ef{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;margin-top:10px;}

function parse(p){
  const t = String(p || '').trim().split(/\s+/).filter(Boolean).map(x=>{
    const o = [];
    for(const ch of x){ if(ch >= '1' && ch <= '5'){ const n = +ch; if(!o.some(v=> v % 10 === n)) o.push(n); } else if(ch === '!' && o.length && o[o.length - 1] < 10) o[o.length - 1] += 10; }

  });

}
const FN = ['', 'pulgar', 'índice', 'medio', 'anular', 'meñique'];
const fnames = a=> a.length ? a.map(v=> v > 10 ? `<b class="acc">${FN[v - 10]}</b>` : FN[v]).join(' + ') : 'descanso';
function steps(x){

  return Array.from({ length: n }, (_, i)=> ({ L: P.L[i % a], R: P.R[i % b] }));
}
const tok = (a, sg)=> a.length ? a.map(v=> v > 10 ? `<b class="acc">${sg}${v - 10}</b>` : sg + v).join('') : '·';
const isSym = x=> x.L.trim() === x.R.trim();
function notation(x){
  const t = isSym(x) ? parse(x.L).map(a=> tok(a, '')) : steps(x).map(st=> st.L.length || st.R.length ? (st.L.length ? tok(st.L, '−') : '') + (st.R.length ? tok(st.R, '+') : '') : '·');
  const g = (x.sub || 1) > 1 ? x.sub : (x.beats || 4), out = [];
  for(let i = 0; i < t.length; i += g) out.push(t.slice(i, i + g).join(' '));
  return out.join('  |  ');
}
function capOf(st){
  const same = st.L.join() === st.R.join();
  if(same) return [fnames(st.L), st.L.length ? tok(st.L, '') + ' · las dos manos' : ''];

}

function closeMenu(){ menu.classList.remove('open'); }
function openMenu(btn){
  if(menu.classList.contains('open')){ closeMenu(); return; }
  const dark = document.documentElement.classList.contains('dark');
  menu.innerHTML = `<button data-mi="export">↓ Guardar copia (exportar)</button><button data-mi="import">↑ Cargar copia (importar)</button><button data-mi="restore">↺ Recuperar ejercicios de ejemplo</button><button data-mi="theme">${dark ? '☀ Tema claro' : '☾ Tema oscuro'}</button><button data-mi="cloud">☁ Guardar en GitHub</button>`;
  const r = btn.getBoundingClientRect(); menu.classList.add('open');
  const w = menu.offsetWidth; menu.style.top = Math.round(r.bottom + 8) + 'px'; menu.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.right - w)) + 'px';
}
function menuAct(a){
  closeMenu();
  if(a === 'theme'){ const d = !document.documentElement.classList.contains('dark'); document.documentElement.classList.toggle('dark', d); try{ localStorage.setItem('dd_theme', d ? 'dark' : 'light'); }catch(e){} }
  if(a === 'export'){
    const blob = new Blob([JSON.stringify({ format: 'dedos-datos', version: 1, updated: new Date().toISOString(), checks, routines, tempos, logs, ejs, metPresets: mPresets, favs }, null, 1)], { type: 'application/json' });
    const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = 'dedos-datos-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=> URL.revokeObjectURL(u), 2000);
    toast('Copia guardada');
  }
  if(a === 'import') $('#imp').click();
  if(a === 'restore'){ const k = Object.keys(ejs).filter(id=> !ejs[id].own); if(!k.length){ toast('Ya están todos como venían'); return; } if(!confirm('¿Devolver los ejercicios de ejemplo a como venían?\n\nSe recuperan los borrados y se deshacen los cambios que les hayas hecho. Tus ejercicios propios no se tocan.')) return; k.forEach(id=> delete ejs[id]); saveE(); rebuild(); rerender(); toast('Ejercicios de ejemplo recuperados'); }
  if(a === 'cloud' && window.ddSync) window.ddSync.openGh();

const isMap = o=> o && typeof o === 'object' && !Array.isArray(o);
$('#imp').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const o = JSON.parse(r.result);
      if(!o || o.format !== 'dedos-datos' || !isMap(o.checks)) throw 0;
      if(!confirm('¿Juntar esta copia con lo que ya tienes?\n\nNo se borra nada: se añade lo de la copia que no tengas.')) return;
      Object.entries(o.checks).forEach(([n, t])=>{ if(!isDone(n)) checks[n] = t || new Date().toISOString(); });
      if(isMap(o.routines)){ snapR(); Object.entries(o.routines).forEach(([id, rr])=>{ if(!routines[id]) routines[id] = normR(rr); }); dropOld(routines); saveR(); }
      if(isMap(o.tempos)){ Object.assign(tempos, o.tempos); saveT(); }
      if(isMap(o.logs)){ Object.assign(logs, o.logs); saveLog(); }
      if(isMap(o.favs)){ Object.entries(o.favs).forEach(([id, v])=>{ if(!isFav(id)) favs[id] = v || new Date().toISOString(); }); put('dd_favs', favs); }
      if(isMap(o.metPresets)){ Object.entries(o.metPresets).forEach(([id, v])=>{ if(!mPresets[id]) mPresets[id] = v; }); savePresets(); }
      if(isMap(o.ejs)){ Object.entries(o.ejs).forEach(([id, v])=>{ if(!ejs[id]) ejs[id] = v; }); saveE(); rebuild(); }
      saveChecks(); rerender(); toast('Copia cargada');
    }catch(err){ toast('Ese archivo no es una copia de DEDOS'); }
  };
  r.readAsText(f); e.target.value = '';
});

/* --- clics --- */

  const v = t.closest('[data-v]'); if(v){ const a = v.dataset.v; if(a === 'back') back(); if(a === 'fwd') fwd(); if(a === 'home'){ q = ''; qIn.value = ''; if(cur().t !== 'root') go({ t: 'root', ty: ty() }); } if(a === 'menu') openMenu(v); if(a === 'met') openMet(); return; }
  const fam = t.closest('[data-fam]'); if(fam){ go({ t: 'fam', id: fam.dataset.fam }); return; }
  const lv = t.closest('[data-lv]'); if(lv){ const k = +lv.dataset.lv; filt.l = filt.l === k ? null : k; rerender(); return; }
  if(t.closest('[data-all]')){ go({ t: 'all' }); return; }

  if(t.closest('[data-pend]')){ filt.pend = !filt.pend; rerender(); return; }

  if(t.closest('[data-rnew]')){ snapR(); const id = newRoutine(''); saveR(); rerender(); const inp = $(`[data-rid="${id}"] [data-rname]`); if(inp){ inp.scrollIntoView({ block: 'center' }); inp.focus(); } return; }
  const blk = t.closest('[data-rid]'), rid = blk && blk.dataset.rid, R = rid && routines[rid];
  if(R && t.closest('[data-rgo]')){ startSes(rid); return; }

  if(R && t.closest('[data-rcol]')){ snapR(); R.color = RCOL[(RCOL.indexOf(R.color) + 1) % RCOL.length]; saveR(); rerender(); return; }
  if(R && t.closest('[data-radd]')){ openPick(rid, R.items.length); return; }
  const rh = t.closest('[data-rh]'); if(R && rh){ snapR(); const lvl = +rh.dataset.rh; R.items.push(lvl === 1 ? { h: 1, t: '' } : { h: 2, t: '', d: '' }); saveR(); rerender(); const ins = document.querySelectorAll(`[data-rid="${rid}"] [data-ii="${R.items.length - 1}"] [data-hed=t]`); if(ins[0]){ ins[0].focus(); ins[0].scrollIntoView({ block: 'center' }); } return; }
  const ha = t.closest('[data-hadd]'); if(R && ha){ const i = +ha.dataset.hadd; openPick(rid, sectionEnd(R, i), R.items[i].t || (R.items[i].h === 1 ? 'título' : 'subtítulo')); return; }
  if(R && t.closest('[data-rm]')){ const i = +t.closest('[data-rm]').dataset.rm, x = R.items[i]; if(typeof x !== 'string' && (x.t || x.d) && !confirm('¿Quitar «' + (x.t || 'sin nombre') + '»? Sus ejercicios se quedan.')) return; snapR(); R.items.splice(i, 1); saveR(); rerender(); return; }
  if(R && t.closest('[data-up]')){ const i = +t.closest('[data-up]').dataset.up; snapR(); [R.items[i - 1], R.items[i]] = [R.items[i], R.items[i - 1]]; saveR(); rerender(); return; }
  const c = t.closest('.card'); if(!c) return;
  const n = c.dataset.name;
  if(t.closest('[data-fav]')){ const on = toggleFav(n); if(filt.fav || cur().t === 'favs') rerender(); else { const fb = t.closest('[data-fav]'); fb.classList.toggle('on', on); fb.textContent = on ? '★' : '☆'; fb.title = on ? 'Quitar de favoritos' : 'Añadir a favoritos'; fb.setAttribute('aria-label', fb.title); } toast(on ? 'Añadido a favoritos' : 'Quitado de favoritos'); return; }
  if(t.closest('[data-add]')){ addFlow(n, t.closest('[data-add]')); return; }
  if(t.closest('[data-edit]')){ openEdit(n); return; }
  if(t.closest('[data-ck]')){ const on = toggle(n); if(filt.pend && on || R){ rerender(); } else { c.classList.toggle('done', on); t.closest('[data-ck]').classList.toggle('on', on); } toast(on ? 'Automatizado' : 'Desmarcado'); return; }
  const cx = BYN.get(n); if(cx && cx.f.nohands) openEdit(n); else openPlay(n);
});
document.addEventListener('input', e=>{
  const b = e.target.closest && e.target.closest('[data-rid]'); if(!b || !routines[b.dataset.rid]) return;
  if(e.target.matches('[data-rname]')){ routines[b.dataset.rid].name = e.target.value; saveR(); }

qIn.addEventListener('input', e=>{

  back();
});
window.ddApply = function(m){
  favs = m.f || {}; put('dd_favs', favs);
  checks = m.c || {}; tempos = m.t || {}; logs = m.g || {}; ejs = m.x || {}; put('dd_ejs', ejs); mPresets = m.p || {}; put('dd_metp', mPresets); if(met.classList.contains('open')) mRender(); rebuild(); routines = {}; Object.entries(m.r || {}).forEach(([id, r])=> routines[id] = normR(r));
  if(dropOld(routines)) setTimeout(dirty, 50);
  put(CK, checks); put(RK, routines); put(TK, tempos); put(GK, logs);
  const a = document.activeElement; if(a && a.matches && a.matches('[data-rname],[data-rnote],[data-hed],#pkq')) return;
  if(pick.classList.contains('open')) drawPick(); if(!S) rerender();
};
window.ddData = ()=> ({ c: checks, r: routines, t: tempos, g: logs, x: ejs, p: mPresets, f: favs });
window.ddNormR = normR;

render(true);
const bh = document.getElementById('boot-hide');
if(bh) requestAnimationFrame(()=> requestAnimationFrame(()=> bh.remove()));
})();

<script>
/* ================= GUARDADO EN GITHUB =================
   Los automatizados, las rutinas, los tempos y las sesiones viven en dedos-datos.json dentro de tu repositorio.
   Al cambiar algo se sube a los pocos segundos; al abrir la app se baja lo último. Si dos aparatos cambian a la vez, se juntan. */
(function(){
"use strict";
const $ = (s, e)=> (e || document).querySelector(s);
const esc = s=> String(s == null ? '' : s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S = JSON.stringify;
const CFG = 'dd_gh', BASEK = 'dd_sync_base', FILE = 'dedos-datos.json';
let gh = null; try{ gh = JSON.parse(localStorage.getItem(CFG) || 'null'); }catch(e){}
const ghOk = ()=> !!(gh && gh.owner && gh.repo && gh.token && gh.branch);
const dirp = ()=> gh && gh.dir ? gh.dir.replace(/^\/+|\/+$/g, '') + '/' : '';
const apiBase = ()=> (gh && gh.api) || 'https://api.github.com';
let syncing = false, again = false, timer = 0, lastSync = 0, state = 'none', firstMode = null, lastMsg = '';
const toast = m=> window.ddToast && window.ddToast(m);

/* ---------- la nube ---------- */
const cloud = document.createElement('button'); cloud.id = 'ml-cloud'; cloud.setAttribute('aria-label', 'Guardado en GitHub');
cloud.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h10.5a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.6 9.1 4.75 4.75 0 0 0 7 18.5z"/><path class="slash" d="M4 4l16 16"/></svg>';
document.body.appendChild(cloud);
function titleOf(v){
  return { ok: 'Guardado en GitHub', sync: 'Guardando…', pending: 'Cambios por guardar', off: 'Sin conexión: se guardará al volver', err: 'No se pudo guardar' + (lastMsg ? ': ' + lastMsg : ''), none: 'Sin conectar: toca para guardar en GitHub' }[v] || '';
}
function setState(s, msg){
  state = s; lastMsg = msg || (s === 'err' ? lastMsg : '');
  const v = ghOk() ? s : 'none';
  cloud.className = 's-' + v; cloud.title = titleOf(v);
  const st = $('#mlg-state'); if(st) st.textContent = titleOf(v);
}

/* ---------- API de GitHub ---------- */
let trace = [];
function note(t){ trace.push(new Date().toLocaleTimeString('es-ES') + ' ' + t); if(trace.length > 6) trace.shift(); const d = $('#mlg-trace'); if(d) d.textContent = trace.join('\n'); }
async function ghApi(path, opt){
  opt = opt || {};
  const ctl = new AbortController(), to = setTimeout(()=> ctl.abort(), 25000), m = opt.method || 'GET';
  try{
    const r = await fetch(`${apiBase()}/repos/${gh.owner}/${gh.repo}${path}`, { method: m, cache: 'no-store', signal: ctl.signal,
      headers: Object.assign({ Authorization: 'Bearer ' + gh.token, Accept: opt.raw ? 'application/vnd.github.raw' : 'application/vnd.github+json' }, opt.body ? { 'Content-Type': 'application/json' } : {}),
      body: opt.body ? S(opt.body) : undefined });
    note(m + ' ' + r.status);
    if(!r.ok && r.status !== 404 || (r.status === 404 && m !== 'GET')){ try{ const j = await r.clone().json(); if(j && j.message) note('GitHub dice: ' + j.message); }catch(e){} }
    return r;
  }catch(e){
    note(m + ' ' + (ctl.signal.aborted ? 'sin respuesta (25 s)' : 'fallo de red: ' + (e && e.message || e)));
    throw new Error(ctl.signal.aborted ? 'GitHub no responde' : 'no se pudo hablar con GitHub (' + (e && e.message || e) + ')');
  }finally{ clearTimeout(to); }
}
const b64enc = str=> btoa(unescape(encodeURIComponent(str)));
const b64dec = b=> decodeURIComponent(escape(atob(b.replace(/\s/g, ''))));
function guessFromUrl(){
  const h = location.hostname.match(/^([^.]+)\.github\.io$/i); if(!h) return {};
  const parts = location.pathname.split('/').filter(Boolean); if(parts.length && /\.html?$/i.test(parts[parts.length - 1])) parts.pop();
  if(!parts.length) return { owner: h[1], repo: h[1] + '.github.io', dir: '' };
  return { owner: h[1], repo: parts[0], dir: parts.slice(1).join('/') };
}
function loadBase(){ try{ return JSON.parse(localStorage.getItem(BASEK) || 'null'); }catch(e){ return null; } }
function saveBase(o){ try{ localStorage.setItem(BASEK, S(o)); }catch(e){} }
const isMap = o=> o && typeof o === 'object' && !Array.isArray(o);
const sortMap = (m, f)=>{ const o = {}; Object.keys(isMap(m) ? m : {}).sort().forEach(k=> o[k] = f ? f(m[k]) : m[k]); return o; };
const snap = ()=>{ const d = window.ddData(); return { c: sortMap(d.c, v=> v || ''), r: sortMap(d.r, window.ddNormR), t: sortMap(d.t), g: sortMap(d.g), x: sortMap(d.x), p: sortMap(d.p), f: sortMap(d.f, v=> v || '') }; };
const valid = o=> !!o && o.format === 'dedos-datos' && isMap(o.checks);

/* ---------- fusión a tres bandas: lo último común (b), lo de aquí (l) y lo de GitHub (r) ---------- */
function mapMerge(b, l, r){
  const out = {}; l = l || {}; r = r || {};
  new Set([...Object.keys(l), ...Object.keys(r), ...Object.keys(b || {})]).forEach(k=>{
    const li = l[k], ri = r[k]; let v;
    if(!b) v = ri !== undefined ? ri : li;
    else { const bi = b[k], lc = S(li) !== S(bi), rc = S(ri) !== S(bi); v = !lc ? ri : !rc ? li : (li === undefined ? ri : ri === undefined ? li : li); }
    if(v !== undefined) out[k] = v;
  });
  const sorted = {}; Object.keys(out).sort().forEach(k=> sorted[k] = out[k]); return sorted;
}

/* ---------- sincronizar ---------- */
function scheduleSync(ms){ if(!ghOk()) return; clearTimeout(timer); setState('pending'); timer = setTimeout(sync, ms == null ? 900 : ms); }
window.ddDirty = ()=> scheduleSync();
async function sync(){
  if(!ghOk()) return;
  if(syncing){ again = true; return; }
  if(!navigator.onLine){ setState('off'); return; }
  syncing = true; setState('sync'); clearTimeout(timer);
  try{
    for(let tries = 0; tries < 3; tries++){
      const path = dirp() + FILE, r = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch));
      if(r.status === 401) throw new Error('la llave no es válida o ha caducado');
      if(r.status === 403 || r.status === 429) throw new Error('GitHub no deja guardar ahora (' + r.status + ')');
      if(!r.ok && r.status !== 404) throw new Error('lectura ' + r.status);
      let remote = null, sha;
      if(r.ok){
        const j = await r.json(); sha = j.sha;
        let txt = j.content ? b64dec(j.content) : '';
        if(!txt){ const rr = await ghApi('/contents/' + path + '?ref=' + encodeURIComponent(gh.branch), { raw: true }); txt = await rr.text(); }
        let o = null; try{ o = JSON.parse(txt); }catch(e){}
        if(!valid(o)) throw new Error('el archivo ' + FILE + ' de GitHub no es de DEDOS');
        remote = { c: sortMap(o.checks, v=> v || ''), r: sortMap(o.routines, window.ddNormR), t: sortMap(o.tempos), g: sortMap(o.logs), x: sortMap(o.ejs), p: sortMap(o.metPresets), f: sortMap(o.favs, v=> v || '') };
      }
      const base = loadBase(), local = snap();
      let merged;
      if(remote && firstMode === 'replace') merged = remote;
      else if(remote) merged = { c: mapMerge(base && base.c, local.c, remote.c), r: mapMerge(base && base.r, local.r, remote.r), t: mapMerge(base && base.t, local.t, remote.t), g: mapMerge(base && base.g, local.g, remote.g), x: mapMerge(base && base.x, local.x, remote.x), p: mapMerge(base && base.p, local.p, remote.p), f: mapMerge(base && base.f, local.f, remote.f) };
      else merged = local;
      if(!remote || S(merged) !== S(remote)){
        const body = { message: 'DEDOS: ' + new Date().toLocaleString('es-ES'), content: b64enc(S({ format: 'dedos-datos', version: 1, updated: new Date().toISOString(), checks: merged.c, routines: merged.r, tempos: merged.t, logs: merged.g, ejs: merged.x, metPresets: merged.p, favs: merged.f }, null, 1)), branch: gh.branch };
        if(sha) body.sha = sha;
        const p = await ghApi('/contents/' + path, { method: 'PUT', body });
        if(p.status === 409 || p.status === 422) continue;
        if(p.status === 401) throw new Error('la llave no es válida o ha caducado');
        if(p.status === 403 || p.status === 404) throw new Error('GitHub no deja escribir (' + p.status + '). Mira el motivo en el registro de abajo');
        if(!p.ok) throw new Error('escritura ' + p.status);
      }
      lastSync = Date.now();
      if(S(snap()) !== S(local)){ again = true; if(firstMode === 'replace') firstMode = 'merge'; setState('pending'); return; }
      if(S(merged) !== S(local) && window.ddApply) window.ddApply(merged);
      saveBase(merged); firstMode = null;
      setState('ok');
      return;
    }
    throw new Error('conflicto: otro aparato guardó a la vez');
  }catch(e){
    setState(!navigator.onLine ? 'off' : 'err', String(e && e.message || e));
  }finally{
    syncing = false;
    if(again){ again = false; scheduleSync(300); }
  }
}
addEventListener('online', ()=> scheduleSync(200));
addEventListener('offline', ()=> setState('off'));
document.addEventListener('visibilitychange', ()=>{
  if(!ghOk()) return;
  if(document.visibilityState === 'visible'){ if(Date.now() - lastSync > 5000) sync(); }
  else if(state === 'pending'){ clearTimeout(timer); sync(); }
});
addEventListener('pagehide', ()=>{ if(ghOk() && state === 'pending'){ clearTimeout(timer); sync(); } });
setInterval(()=>{ if(ghOk() && document.visibilityState === 'visible' && !syncing && state !== 'pending' && Date.now() - lastSync > 30000) sync(); }, 10000);

/* ---------- panel: conectar con GitHub ---------- */
const panel = document.createElement('div'); panel.id = 'ml-gh'; document.body.appendChild(panel);
function openGh(msg){
  const g = Object.assign(guessFromUrl(), gh || {});
  panel.innerHTML = `<div class="g" role="dialog" aria-label="Guardar en GitHub">
    <h3>☁ Guardar en GitHub</h3>
    <div class="st">${ghOk() ? 'Conectado. <span id="mlg-state"></span><pre id="mlg-trace" style="white-space:pre-wrap;font-size:11px;margin:6px 0 0;opacity:.8"></pre>' : 'Pega tu llave de GitHub y pulsa Conectar. El resto ya viene puesto si abres la app desde tu web.'}</div>
    <label for="mlg-token">Llave (token)</label><input id="mlg-token" type="password" value="${esc(g.token || '')}" placeholder="github_pat_…" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-owner">Usuario de GitHub</label><input id="mlg-owner" value="${esc(g.owner || '')}" placeholder="tu-usuario" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-repo">Repositorio</label><input id="mlg-repo" value="${esc(g.repo || '')}" placeholder="nombre-del-repositorio" autocomplete="off" spellcheck="false" autocapitalize="off">
    <label for="mlg-dir">Carpeta dentro del repositorio (vacío si está en la raíz)</label><input id="mlg-dir" value="${esc(g.dir || '')}" placeholder="vacío" autocomplete="off" spellcheck="false" autocapitalize="off">
    ${msg ? `<div class="er">${esc(msg)}</div>` : ''}
    <div class="rw"><button class="pri" data-g="connect">${ghOk() ? 'Guardar cambios' : 'Conectar'}</button>${ghOk() ? '<button data-g="now">Sincronizar ahora</button><button class="dng" data-g="off">Desconectar este aparato</button>' : ''}<button data-g="close">Cerrar</button></div>
    <details><summary>¿Cómo creo la llave?</summary><ol>
      <li>En GitHub: tu foto → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token.</li>
      <li>«Repository access»: Only select repositories → elige el repositorio de DEDOS.</li>
      <li>«Permissions» → Repository permissions → <b>Contents: Read and write</b>.</li>
      <li>Generar, copiar la llave (empieza por github_pat_) y pegarla aquí. Hay que hacerlo en cada aparato.</li></ol></details></div>`;
  panel.classList.add('open'); setState(state); note('(panel abierto)');
}
function closeGh(){ panel.classList.remove('open'); panel.innerHTML = ''; }
panel.addEventListener('click', async e=>{
  if(e.target === panel) return closeGh();
  const t = e.target.closest('[data-g]'); if(!t) return;
  const a = t.dataset.g;
  if(a === 'close') return closeGh();
  if(a === 'now'){ note('sincronizando…'); sync(); return; }
  if(a === 'off'){ gh = null; try{ localStorage.removeItem(CFG); localStorage.removeItem(BASEK); }catch(err){} clearTimeout(timer); setState('none'); closeGh(); toast('Este aparato ya no guarda en GitHub'); return; }
  if(a === 'connect'){
    const v = id=> $(id).value.trim();
    const cand = { token: v('#mlg-token'), owner: v('#mlg-owner'), repo: v('#mlg-repo').replace(/\.git$/, ''), dir: v('#mlg-dir').replace(/^\/+|\/+$/g, '') };
    if(gh && gh.api) cand.api = gh.api;
    if(!cand.token || !cand.owner || !cand.repo) return openGh('Faltan la llave, el usuario o el repositorio.');
    t.textContent = 'Comprobando…'; t.disabled = true;
    try{
      const base = cand.api || 'https://api.github.com';
      const r = await fetch(`${base}/repos/${cand.owner}/${cand.repo}`, { headers: { Authorization: 'Bearer ' + cand.token, Accept: 'application/vnd.github+json' }, cache: 'no-store' });
      if(r.status === 401) return openGh('La llave no es válida. Cópiala otra vez entera (empieza por github_pat_).');
      if(r.status === 404) return openGh('No encuentro ese repositorio, o la llave no tiene acceso a él. Revisa el usuario, el nombre del repositorio y que lo elegiste al crear la llave.');
      if(!r.ok) return openGh('GitHub ha respondido con un error (' + r.status + '). Prueba otra vez en un momento.');
      const j = await r.json();
      if(j.permissions && !j.permissions.push) return openGh('La llave puede leer pero no escribir. En la llave, el permiso «Contents» tiene que estar en «Read and write».');
      const same = gh && gh.owner === cand.owner && gh.repo === cand.repo && (gh.dir || '') === cand.dir;
      gh = Object.assign({}, cand, { branch: j.default_branch || 'main' });
      localStorage.setItem(CFG, S(gh));
      if(!same) localStorage.removeItem(BASEK);
      firstMode = null;
      if(!loadBase()){
        const fr = await ghApi('/contents/' + dirp() + FILE + '?ref=' + encodeURIComponent(gh.branch));
        if(fr.ok) firstMode = confirm('En GitHub ya hay datos de DEDOS guardados.\n\nAceptar: usar en este aparato los de GitHub (lo que haya aquí se sustituye).\nCancelar: juntar lo de este aparato con lo de GitHub.') ? 'replace' : 'merge';
      }
      closeGh(); toast('Conectado con GitHub'); setState('pending'); sync();
    }catch(err){ openGh('No hay conexión con GitHub. Comprueba internet y vuelve a probar.'); }
  }
});
document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && panel.classList.contains('open')) closeGh(); });
cloud.addEventListener('click', ()=> openGh());
setState(ghOk() ? 'pending' : 'none'); if(ghOk()) sync();
window.ddSync = { sync, openGh, state: ()=> state };
})();
</script>
</body>
